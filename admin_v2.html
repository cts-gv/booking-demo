<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barber Shop Admin</title>
<style>
:root{--bg:#0b0b0d;--panel:#151519;--panel2:#1d1d22;--gold:#c9a227;--gold2:#e4c45c;--text:#f5f3ed;--muted:#aaa6a0;--border:#302f34;--danger:#d86b6b;--ok:#74c69d}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#201b10 0,#0b0b0d 42%);color:var(--text);font-family:Arial,sans-serif}
.container{max-width:1200px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}
h1,h2{margin:0}.subtitle{color:var(--muted);margin-top:7px}.panel{background:rgba(21,21,25,.94);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 12px 35px rgba(0,0,0,.28);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:15px}.stat b{display:block;font-size:25px;margin-top:5px}.label{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1}.field.small{max-width:180px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:#101014;color:var(--text);font:inherit}
button{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;background:var(--gold);color:#111}button:hover{background:var(--gold2)}button.secondary{background:#29282d;color:var(--text);border:1px solid var(--border)}button.danger{background:#6d2f32;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:12px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{color:var(--gold2);font-size:13px;text-transform:uppercase;letter-spacing:.04em}td{font-size:14px}.muted{color:var(--muted)}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#263c31;color:#a9e5c5}.status.cancelled{background:#432528;color:#f2aaaa}
.login{max-width:420px;margin:10vh auto}.message{padding:10px 12px;border-radius:9px;margin-top:12px;display:none}.message.error{display:block;background:#402528;color:#ffb5b5}.message.ok{display:block;background:#20372d;color:#a8e4c2}.hidden{display:none!important}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}.container{padding:18px 12px}}
</style>
</head>
<body>
<div id="loginView" class="container login">
  <div class="panel">
    <h1>Admin Login</h1>
    <p class="subtitle">Barber Shop appointment management</p>
    <form id="loginForm" style="margin-top:20px">
      <div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div>
      <div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div>
      <button type="submit" style="width:100%;margin-top:16px">Sign In</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </div>
</div>

<div id="appView" class="container hidden">
  <div class="top">
    <div><h1>Barber Shop Admin</h1><div class="subtitle">Appointments and schedule</div></div>
    <div class="actions"><button id="refreshBtn" class="secondary">Refresh</button><button id="logoutBtn" class="secondary">Sign Out</button></div>
  </div>

  <div class="grid">
    <div class="stat"><span class="label">Today</span><b id="todayCount">0</b></div>
    <div class="stat"><span class="label">Upcoming</span><b id="upcomingCount">0</b></div>
    <div class="stat"><span class="label">Confirmed</span><b id="confirmedCount">0</b></div>
    <div class="stat"><span class="label">Cancelled</span><b id="cancelledCount">0</b></div>
  </div>

  <div class="panel" style="margin-top:18px">
    <div class="controls">
      <div class="field small"><label>Date</label><input id="dateFilter" type="date"></div>
      <div class="field small"><label>Barber</label><select id="barberFilter"><option value="">All barbers</option></select></div>
      <div class="field"><label>Search customer</label><input id="searchFilter" placeholder="Name, email, or phone"></div>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>
  </div>

  <div class="panel">
    <div class="top" style="margin-bottom:12px"><div><h2>Appointments</h2><div id="lastUpdated" class="subtitle"></div></div></div>
    <div id="appMessage" class="message"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date / Time</th><th>Customer</th><th>Barber</th><th>Service</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="appointmentsBody"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ghnkxpsddhmluyoaqtsx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_zUuj6Jd_CYfjbg2nt_K-VA_mNRGYoVL';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let allAppointments = [];
let barbers = [];

const $ = id => document.getElementById(id);
function msg(el, text, type='error'){el.textContent=text;el.className='message '+type}
function clearMsg(el){el.textContent='';el.className='message'}
function localDateString(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function formatTime(t){const [h,m]=String(t).slice(0,5).split(':');let hr=Number(h)%12||12;return `${hr}:${m} ${Number(h)>=12?'PM':'AM'}`}
function formatDate(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}

async function invokeAdmin(action, extra={}){
  const {data:{session}}=await _supabase.auth.getSession();
  if(!session) throw new Error('Your session has expired. Please sign in again.');
  const {data,error}=await _supabase.functions.invoke('admin-appointments',{body:{action,...extra}});
  if(error) throw new Error(error.message||'Admin request failed.');
  if(data?.error) throw new Error(data.error);
  return data;
}

async function loadBarbers(){
  const {data,error}=await _supabase.from('barbers').select('id,name').eq('active',true).order('name');
  if(error) throw error;
  barbers=data||[];
  $('barberFilter').innerHTML='<option value="">All barbers</option>'+barbers.map(b=>`<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('');
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

async function loadAppointments(){
  clearMsg($('appMessage'));
  try{
    const data=await invokeAdmin('list');
    allAppointments=data.appointments||[];
    render();
    $('lastUpdated').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){msg($('appMessage'),e.message)}
}

function render(){
  const today=localDateString();
  const confirmed=allAppointments.filter(a=>a.status==='confirmed');
  $('todayCount').textContent=confirmed.filter(a=>a.appointment_date===today).length;
  $('upcomingCount').textContent=confirmed.filter(a=>a.appointment_date>=today).length;
  $('confirmedCount').textContent=confirmed.length;
  $('cancelledCount').textContent=allAppointments.filter(a=>a.status==='cancelled').length;

  const date=$('dateFilter').value, barber=$('barberFilter').value, q=$('searchFilter').value.trim().toLowerCase();
  const rows=allAppointments.filter(a=>{
    if(date && a.appointment_date!==date)return false;
    if(barber && a.barber_id!==barber)return false;
    if(q && ![a.customer_name,a.customer_email,a.customer_phone,a.barber_name,a.service_name].some(v=>String(v??'').toLowerCase().includes(q)))return false;
    return true;
  }).sort((a,b)=>`${a.appointment_date} ${a.appointment_time}`.localeCompare(`${b.appointment_date} ${b.appointment_time}`));

  $('appointmentsBody').innerHTML=rows.length?rows.map(a=>`
    <tr>
      <td><strong>${formatDate(a.appointment_date)}</strong><br>${formatTime(a.appointment_time)}</td>
      <td>${escapeHtml(a.customer_name)}<br><span class="muted">${escapeHtml(a.customer_email)}</span></td>
      <td>${escapeHtml(a.barber_name||a.barber_id)}</td>
      <td>${escapeHtml(a.service_name)}<br><span class="muted">${a.duration_minutes||''} min</span></td>
      <td>${escapeHtml(a.customer_phone)}</td>
      <td><span class="status ${a.status==='cancelled'?'cancelled':''}">${escapeHtml(a.status)}</span></td>
      <td>${a.status==='confirmed'?`<button class="danger" onclick="cancelAppointment('${a.id}')">Cancel</button>`:'—'}</td>
    </tr>`).join(''):'<tr><td colspan="7" class="muted">No appointments match the current filters.</td></tr>';
}

async function cancelAppointment(id){
  const app=allAppointments.find(a=>a.id===id); if(!app)return;
  if(!confirm(`Cancel ${app.customer_name}'s ${app.service_name} appointment on ${formatDate(app.appointment_date)} at ${formatTime(app.appointment_time)}?`))return;
  try{await invokeAdmin('cancel',{appointment_id:id});await loadAppointments();msg($('appMessage'),'Appointment cancelled.','ok')}
  catch(e){msg($('appMessage'),e.message)}
}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();clearMsg($('loginMessage'));
  try{
    const {error}=await _supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if(error)throw error;
  }catch(e){msg($('loginMessage'),e.message)}
});
$('logoutBtn').onclick=()=>_supabase.auth.signOut();
$('refreshBtn').onclick=loadAppointments;
$('dateFilter').oninput=render;$('barberFilter').onchange=render;$('searchFilter').oninput=render;
$('clearBtn').onclick=()=>{$('dateFilter').value='';$('barberFilter').value='';$('searchFilter').value='';render()};

_supabase.auth.onAuthStateChange(async (_event,session)=>{
  if(session){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');try{await loadBarbers();await loadAppointments()}catch(e){msg($('appMessage'),e.message)}}
  else{$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')}
});
</script>
</body>
</html>
